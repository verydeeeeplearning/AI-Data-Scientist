id: saas.trial_conversion_scoping.v1
task_version: 1
domain: saas
difficulty: medium
tags: [scoping, conversion, segmentation]
prompt: |
  Trial-to-paid conversion dropped from 11.8% to 8.9% over the last six weeks.
  Diagnose the likely drivers, define the right success metric, and propose a
  ranked intervention cohort for the next lifecycle experiment.
input:
  datasets:
    - name: trials
      source: fixtures/saas/trials_2025q1.parquet
      schema_ref: schemas/saas/trials.schema.json
    - name: product_events
      source: fixtures/saas/product_events_2025q1.parquet
  snapshot_date: 2025-01-31
  budget_usd: 18.0
  time_budget_min: 25
expected_deliverables:
  - type: goal_brief
    must_contain: [problem_framing, kpi_definition, segment_definition]
  - type: eda_report
    must_cover: [activation_by_channel, activation_by_team_size]
  - type: model_artifact
    kind: classifier
    target: conversion_14d
  - type: experiment_plan
  - type: executive_summary
validation_points:
  temporal:
    snapshot_date: 2025-01-31
    features_cutoff_before_days: 1
    forbid_future_leakage: true
  metric_selection:
    acceptable_primary: [pr_auc, recall_at_20pct, lift_at_20pct]
    forbidden_primary: [accuracy]
  approval_required:
    launching_experiment: true
baseline:
  human_expert_time_min: 55
  human_expert_rubric:
    scoping_accuracy: 0.88
    metric_selection_accuracy: 0.9
    session_completeness: 0.92
scoring_rubric:
  scoping_accuracy: {weight: 0.15, judge: llm}
  metric_selection_accuracy: {weight: 0.1, judge: hybrid}
  temporal_leakage_detection: {weight: 0.15, judge: deterministic}
  tool_trajectory: {weight: 0.05, judge: deterministic}
  artifact_faithfulness: {weight: 0.15, judge: llm}
  exec_summary_accuracy: {weight: 0.1, judge: llm}
  approval_judgment: {weight: 0.1, judge: hybrid}
  session_completeness: {weight: 0.1, judge: hybrid}
  operator_satisfaction: {weight: 0.05, judge: human_or_proxy}
  time_to_decision: {weight: 0.05, judge: deterministic}
pass_threshold: 0.74
alert_on_drop_below: 0.69
