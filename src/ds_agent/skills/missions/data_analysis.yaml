name: data_analysis
version: 1
summary: Exploratory data analysis mission for onboarding users who need a decision-ready readout from a dataset.
authority_default: supervised
audience_default: senior_staff
skills_required:
  - scoping
  - data-profiling
  - eda
  - reporting
boundary:
  allowed_data_domains:
    - product
    - growth
    - operations
  required_semantic_metrics:
    - metric_definition_confirmed
    - segment_coverage
    - trend_delta
  allowed_action_classes:
    - read_sql_gold
    - read_sql_bronze
    - artifact_draft
required_checks:
  - schema_drift
  - metric_definition_confirmed
  - subgroup_stability
  - baseline_compare
required_artifacts:
  - exec_brief
  - ds_appendix
auto_escalate_when:
  - sensitive_data_detected
  - source_data_untrusted
  - stakeholder_decision_blocked
success_criteria:
  - question_scoped
  - drivers_identified
  - caveats_documented
  - stakeholder_summary_ready
certification:
  current_level: supervised
  next_target: autopilot
  autopilot_requirements:
    shadow_runs_passed: 8
    critical_violations: 0
    verifier_avg_score: 0.8
    rollback_rehearsal: passed
    owner_approvals: 1
