[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-agent"
version = "0.1.0"
description = "AI Data Scientist — Autonomous DS Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "keyring>=24.0",
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # P1-12 artifact export — pure-Python converters bundled with PyInstaller.
    "markdown>=3.5",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "nbformat>=5.10.0",
    "python-pptx>=0.6.23",
    "sentry-sdk==2.58.0",
    # Data / ML stack (RFC_2026-04_ml_deps_policy.md) — promoted from
    # documented-only to actually-installed so the LLM prompt's "Available:"
    # list matches runtime reality. DL frameworks (torch/tensorflow) are
    # kept out of this Epic; add via optional `[dl]` extra later if needed.
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "optuna>=3.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
litellm = ["litellm>=1.40.0", "tiktoken>=0.7.0"]
providers = ["anthropic>=0.30.0", "openai>=1.30.0", "litellm>=1.40.0", "tiktoken>=0.7.0"]
cli = ["typer>=0.12.0", "rich>=13.0", "questionary>=2.0.0"]
gateway = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "websockets>=13.0"]
channels = ["python-telegram-bot>=21.0", "discord.py>=2.4.0", "slack-bolt>=1.20.0"]
distributed = [
    "dask[complete]>=2024.1.0",
    "ray[tune,data]>=2.9.0",
]
vector_search = [
    "sentence-transformers>=2.2.0",
    "lancedb>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]
all = ["ds-agent[providers,cli,gateway,channels,dev]"]

[project.scripts]
ds-agent = "ds_agent.cli.main:main"
ds-agent-daemon = "ds_agent.gateway.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --basetemp=.tmp/pytest"
tmp_path_retention_policy = "none"
cache_dir = ".tmp/pytest/.cache"
markers = [
    "integration: tests that exercise real external systems (OS keyring, DB, network).",
    "nightly: tests intended for nightly CI and optional real-provider coverage.",
]

[tool.coverage.run]
source = ["src/ds_agent"]
data_file = ".tmp/pytest/.coverage"

[tool.coverage.report]
show_missing = true
fail_under = 78

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/ds_agent/tools/*.py" = ["E501"]  # Tool schemas contain long description strings
"*.spec" = ["F821", "F401", "UP009"]  # PyInstaller spec files use injected globals

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "fastapi.*",
    "google.*",
    "google.generativeai.*",
    "litellm.*",
    "openai.*",
    "starlette.*",
    "telegram.*",
    "tiktoken.*",
    "uvicorn.*",
    "yaml.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-recording>=0.13.4",
    "vcrpy>=8.1.1",
]
